{% extends "base.html" %}

{% block title %}
Create book
{% endblock %}

{% block content %}
{% load crispy_forms_tags %}
<h2>Create a new Book </h2>
<form method="post" class="from-group card p-4">
    {% csrf_token %}
    {{form | crispy}}
<button type="submit" class="btn btn-outline-success">Save Book</button><br/>
<a href="{% url 'list' %}" class="btn btn-outline-warning">Cancel</a>

</form>
{% endblock %}
