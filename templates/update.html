{% extends "base.html" %}

{% load crispy_forms_tags %}

{% block title %}
Update Book
{% endblock %}

{% block content %}

<h2>Update a Book</h2>

<form method="post" class="form-group card p-4">
    {% csrf_token %}

    {{ form|crispy }}

    <button type="submit" class="btn btn-outline-success">
        Save Book
    </button>

    <a href="{% url 'book_home' %}" class="btn btn-outline-warning">
        Cancel
    </a>
</form>

{% endblock %}
